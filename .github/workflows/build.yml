name: Build

# Каждый пуш в main собирает программу и установщик.
# Если версии из файла VERSION ещё нет в Releases, релиз vX.Y.Z создаётся автоматически.
# Чтобы выпустить новую версию, достаточно изменить VERSION.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# По умолчанию — только чтение. Право записи есть лишь у шага публикации релиза.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Неверная версия в VERSION: $v" }
          $release = 'false'
          if ('${{ github.event_name }}' -ne 'pull_request' -and '${{ github.ref }}' -eq 'refs/heads/main') {
            gh release view "v$v" --repo '${{ github.repository }}' *> $null
            if ($LASTEXITCODE -ne 0) { $release = 'true' }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "Версия $v, новый релиз: $release"
          exit 0   # «релиза нет» — ожидаемый ответ gh, а не ошибка шага

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.ver.outputs.version }} -Url "https://github.com/${{ github.repository }}"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # создать релиз
      id-token: write        # подписать подтверждение происхождения сборки
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Подтверждение происхождения: любой может проверить, что установщик собран
      # именно этим репозиторием в GitHub Actions:
      #   gh attestation verify AutoUnpack-Setup-X.Y.Z.exe --repo <владелец>/AutoUnpack
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/AutoUnpack-Setup-*.exe
            dist/AutoUnpack.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Распаковщик архивов ${{ needs.build.outputs.version }}
          files: |
            dist/AutoUnpack-Setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
