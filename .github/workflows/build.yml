name: Build

# Каждый пуш в main собирает программу и установщик.
# Если версии из файла VERSION ещё нет в Releases, релиз vX.Y.Z создаётся автоматически.
# Чтобы выпустить новую версию, достаточно изменить VERSION.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Неверная версия в VERSION: $v" }
          "VERSION=$v" >> $env:GITHUB_ENV
          $release = 'false'
          if ('${{ github.event_name }}' -ne 'pull_request' -and '${{ github.ref }}' -eq 'refs/heads/main') {
            gh release view "v$v" --repo '${{ github.repository }}' *> $null
            if ($LASTEXITCODE -ne 0) { $release = 'true' }
          }
          "RELEASE=$release" >> $env:GITHUB_ENV
          Write-Host "Версия $v, новый релиз: $release"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version $env:VERSION -Url "https://github.com/${{ github.repository }}"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AutoUnpack-${{ env.VERSION }}
          path: dist/*

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Распаковщик архивов ${{ env.VERSION }}
          files: |
            dist/AutoUnpack-Setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
